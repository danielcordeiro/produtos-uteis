<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produtos Úteis</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text: #f1f1f1;
      --muted: #888;
      --inactive: #444;
      --badge-bg: #292929;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .controls {
      max-width: 900px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls input {
      flex: 1;
      min-width: 200px;
      padding: 0.5rem 0.85rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .controls input:focus { border-color: var(--accent); }

    .filter-btns {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 0.4rem 0.85rem;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }

    .grid {
      max-width: 900px;
      margin: 1.5rem auto 3rem;
      padding: 0 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s, transform 0.15s;
    }

    .card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .card.inactive { opacity: 0.45; pointer-events: none; }

    .card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      background: var(--border);
    }

    .card-body {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .card-number {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(245,158,11,0.1);
      padding: 2px 7px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .card-badges {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .badge {
      font-size: 0.68rem;
      padding: 2px 7px;
      border-radius: 20px;
      background: var(--badge-bg);
      color: var(--muted);
      text-transform: capitalize;
    }

    .badge.inactive-badge {
      background: #3a1a1a;
      color: #f87171;
    }

    .card-name {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.5;
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.25rem;
    }

    .card-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .card-price span {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 400;
    }

    .btn {
      display: inline-block;
      padding: 0.4rem 0.9rem;
      background: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 0.82rem;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.15s;
    }

    .btn:hover { background: var(--accent-hover); }

    .empty {
      grid-column: 1/-1;
      text-align: center;
      color: var(--muted);
      padding: 3rem 0;
      font-size: 0.95rem;
    }

    .count {
      color: var(--muted);
      font-size: 0.82rem;
      padding: 0 1rem;
      max-width: 900px;
      margin: 0.5rem auto 0;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header>
  <h1>🛒 Produtos Úteis</h1>
  <p>Produtos que uso e recomendo — links de afiliado</p>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Buscar produto..." oninput="render()" />
  <div class="filter-btns" id="filters"></div>
</div>

<div class="count" id="count"></div>

<div class="grid" id="grid"></div>

<footer>
  Os links desta página são links de afiliado. Ao comprar, você apoia este projeto sem pagar nada a mais. ❤️
</footer>

<script>
  let products = [];
  let activeCategory = 'all';

  const fmt = (v) => v
    ? 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2 })
    : '';

  async function load() {
    const res = await fetch('products.json?' + Date.now());
    products = await res.json();
    buildFilters();
    render();
  }

  function buildFilters() {
    const cats = ['all', ...new Set(products.map(p => p.category).filter(Boolean))];
    const wrap = document.getElementById('filters');
    wrap.innerHTML = cats.map(c => `
      <button class="filter-btn ${c === activeCategory ? 'active' : ''}"
        onclick="setCategory('${c}')">${c === 'all' ? 'Todos' : c}</button>
    `).join('');
  }

  function setCategory(cat) {
    activeCategory = cat;
    buildFilters();
    render();
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = products.filter(p => {
      const matchCat = activeCategory === 'all' || p.category === activeCategory;
      const matchQ = !q || p.name.toLowerCase().includes(q) || (p.description||'').toLowerCase().includes(q);
      return matchCat && matchQ;
    });

    document.getElementById('count').textContent =
      `${filtered.length} produto${filtered.length !== 1 ? 's' : ''}`;

    document.getElementById('grid').innerHTML = filtered.length
      ? filtered.map(card).join('')
      : '<div class="empty">Nenhum produto encontrado.</div>';
  }

  function card(p) {
    const inactive = p.status !== 'active';
    return `
      <div class="card ${inactive ? 'inactive' : ''}">
        <img src="${p.image || 'https://placehold.co/400x300?text=Sem+Imagem'}"
             alt="${p.name}" loading="lazy"
             onerror="this.src='https://placehold.co/400x300?text=Sem+Imagem'" />
        <div class="card-body">
          <div class="card-top">
            <span class="card-number">#${p.number}</span>
            <div class="card-badges">
              ${p.category ? `<span class="badge">${p.category}</span>` : ''}
              ${p.source ? `<span class="badge">${p.source}</span>` : ''}
              ${inactive ? `<span class="badge inactive-badge">indisponível</span>` : ''}
            </div>
          </div>
          <div class="card-name">${p.name}</div>
          <div class="card-desc">${p.description || ''}</div>
          <div class="card-footer">
            <div class="card-price">
              ${p.price ? fmt(p.price) : '<span style="color:var(--muted);font-size:0.85rem">Ver preço</span>'}
            </div>
            ${!inactive ? `<a class="btn" href="${p.affiliate_url}" target="_blank" rel="noopener noreferrer">Ver oferta →</a>` : ''}
          </div>
        </div>
      </div>`;
  }

  load();
</script>
</body>
</html>
