name: Validate Affiliate Links

on:
  schedule:
    - cron: '0 9 * * 1'  # Toda segunda-feira às 09:00 UTC
  workflow_dispatch:       # Permite rodar manualmente também

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate links
        id: validate
        run: node .github/scripts/validate-links.js

      - name: Commit updated products.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add products.json
          git diff --cached --quiet || git commit -m "chore: update link validation status [skip ci]"
          git push

      - name: Send Telegram alert
        if: env.BROKEN_LINKS != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BROKEN_LINKS: ${{ env.BROKEN_LINKS }}
        run: |
          MESSAGE="⚠️ *Produtos Úteis — Links quebrados*%0A%0A${BROKEN_LINKS}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MESSAGE}&parse_mode=Markdown"
